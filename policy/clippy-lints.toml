schema = 1
msrv = "1.93"

[policy]
panic_free_tests = true
allow_test_carveouts = false
suppression_style = "expect-with-reason"
blanket_categories = false

[[lint]]
name = "clippy::dbg_macro"
level = "deny"
status = "active"
class = "panic"
reason = "Debug probes must not reach committed production or test code."

[[lint]]
name = "clippy::todo"
level = "deny"
status = "active"
class = "panic"
reason = "Committed code must not contain runtime todo traps."

[[lint]]
name = "clippy::unimplemented"
level = "deny"
status = "active"
class = "panic"
reason = "Committed code must not contain runtime unimplemented traps."

[[lint]]
name = "clippy::unwrap_used"
level = "deny"
status = "debt-tracked"
class = "panic"
reason = "Target platform policy: no unchecked Result/Option collapse in production or tests."

[[lint]]
name = "clippy::expect_used"
level = "deny"
status = "debt-tracked"
class = "panic"
reason = "Target platform policy: no message-decorated unchecked Result/Option collapse in production or tests."

[[lint]]
name = "clippy::panic"
level = "deny"
status = "debt-tracked"
class = "panic"
reason = "Target platform policy: panic-free production and test code."

[[lint]]
name = "clippy::unreachable"
level = "deny"
status = "debt-tracked"
class = "panic"
reason = "Target platform policy: unreachable traps must be replaced with typed errors or explicit invariants."

[[lint]]
name = "clippy::indexing_slicing"
level = "deny"
status = "debt-tracked"
class = "ast-safety"
reason = "Target platform policy: no unchecked indexing/slicing across parser and protocol boundaries."

[[lint]]
name = "clippy::string_slice"
level = "deny"
status = "debt-tracked"
class = "utf8-safety"
reason = "Target platform policy: string slicing must respect UTF-8 boundaries."

[[planned]]
name = "clippy::same_length_and_capacity"
level = "deny"
activate_when_msrv = "1.94"
reason = "Catch raw-parts reconstruction mistakes."

[[planned]]
name = "clippy::manual_ilog2"
level = "warn"
activate_when_msrv = "1.94"
reason = "Prefer the standard integer log helper."

[[planned]]
name = "clippy::decimal_bitwise_operands"
level = "warn"
activate_when_msrv = "1.94"
reason = "Make bit masks visually inspectable."

[[planned]]
name = "clippy::needless_type_cast"
level = "warn"
activate_when_msrv = "1.94"
reason = "Avoid stale numeric type drift."

[[planned]]
name = "clippy::disallowed_fields"
level = "deny"
activate_when_msrv = "1.95"
reason = "Allow architecture policy to ban direct field access across protected seams."

[[planned]]
name = "clippy::manual_checked_ops"
level = "warn"
activate_when_msrv = "1.95"
reason = "Prefer checked arithmetic over manual divide-by-zero guards."

[[planned]]
name = "clippy::manual_take"
level = "warn"
activate_when_msrv = "1.95"
reason = "Use standard ownership helper instead of local reimplementation."

[[planned]]
name = "clippy::manual_pop_if"
level = "warn"
activate_when_msrv = "1.95"
reason = "Use collection APIs that encode predicate-and-pop intent directly."

[[planned]]
name = "clippy::duration_suboptimal_units"
level = "warn"
activate_when_msrv = "1.95"
reason = "Make durations legible without mental unit conversion."

[[planned]]
name = "clippy::unnecessary_trailing_comma"
level = "warn"
activate_when_msrv = "1.95"
reason = "Keep generated and hand-written format macro calls clean."
