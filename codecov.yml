coverage:
  precision: 2
  round: down
  range: "35...85"
  status:
    project:
      default:
        target: auto
        threshold: 5%
        informational: true
        flags:
          - rust-core-runtime
    patch:
      default:
        target: 70%
        threshold: 20%
        informational: true
        flags:
          - rust-core-runtime
comment: false
github_checks:
  annotations: false
ignore:
  - "target/**"
  - "fuzz/**"
  - "tests/**"
  - "benches/**"
  - "contracts/**"
  - "hosts/**"
  - "crates/*/benches/**"
  - "crates/*/examples/**"
