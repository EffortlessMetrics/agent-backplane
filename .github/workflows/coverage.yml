name: Coverage

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "tarpaulin.toml"
      - ".github/workflows/coverage.yml"
      - "codecov.yml"
      - "docs/ci/coverage.md"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "tarpaulin.toml"
      - ".github/workflows/coverage.yml"
      - "codecov.yml"
      - "docs/ci/coverage.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  coverage:
    name: Codecov Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'coverage') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci') ||
      contains(github.event.pull_request.labels.*.name, 'ci:full')
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --version 0.32.7 --locked

      - name: Run coverage
        run: >-
          cargo tarpaulin --config tarpaulin.toml --lib
          --packages abp-core abp-protocol abp-host abp-runtime
          abp-policy abp-glob abp-workspace abp-capability
          abp-ir abp-mapper abp-dialect abp-receipt
          abp-config abp-error abp-backend-core abp-backend-mock
          abp-stream abp-ratelimit abp-retry abp-validate
        timeout-minutes: 30

      - name: Write coverage receipt
        if: always()
        run: |
          mkdir -p target/tarpaulin
          python3 - <<'PY'
          import json
          import pathlib
          receipt = {
              "schema_version": 1,
              "repo": "agent-backplane",
              "lane": "coverage",
              "tool": "cargo-tarpaulin",
              "flag": "rust-core-runtime",
              "workflow": "Coverage",
              "scope": [
                  "abp-core",
                  "abp-protocol",
                  "abp-host",
                  "abp-runtime",
                  "abp-policy",
                  "abp-glob",
                  "abp-workspace",
                  "abp-capability",
                  "abp-ir",
                  "abp-mapper",
                  "abp-dialect",
                  "abp-receipt",
                  "abp-config",
                  "abp-error",
                  "abp-backend-core",
                  "abp-backend-mock",
                  "abp-stream",
                  "abp-ratelimit",
                  "abp-retry",
                  "abp-validate"
              ],
              "artifacts": {
                  "lcov": pathlib.Path("target/tarpaulin/lcov.info").exists(),
                  "html": pathlib.Path("target/tarpaulin/tarpaulin-report.html").exists(),
              },
              "claim_boundary": [
                  "execution_surface_only",
                  "not_sdk_semantic_fidelity",
                  "not_sidecar_protocol_correctness",
                  "not_backend_behavior",
                  "not_receipt_integrity",
                  "not_daemon_websocket_correctness",
                  "not_policy_safety",
                  "not_bdd_adequacy",
                  "not_fuzz_robustness",
                  "not_release_readiness"
              ],
          }
          pathlib.Path("target/tarpaulin/coverage-receipt.json").write_text(
              json.dumps(receipt, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Detect Codecov token
        id: codecov-token
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "${CODECOV_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage to Codecov (main)
        if: ${{ always() && github.event_name == 'push' && hashFiles('target/tarpaulin/lcov.info') != '' && steps.codecov-token.outputs.present == 'true' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/tarpaulin/lcov.info
          flags: rust-core-runtime
          name: agent-backplane-rust-core-runtime
          fail_ci_if_error: true

      - name: Upload coverage to Codecov (advisory)
        if: ${{ always() && github.event_name != 'push' && hashFiles('target/tarpaulin/lcov.info') != '' && steps.codecov-token.outputs.present == 'true' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/tarpaulin/lcov.info
          flags: rust-core-runtime
          name: agent-backplane-rust-core-runtime
          fail_ci_if_error: false

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/tarpaulin/
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize coverage artifacts
        if: always()
        run: |
          {
            echo "## Coverage"
            echo ""
            echo "| Artifact | Present |"
            echo "| --- | ---: |"
            echo "| lcov.info | $([ -s target/tarpaulin/lcov.info ] && echo yes || echo no) |"
            echo "| HTML report | $([ -s target/tarpaulin/tarpaulin-report.html ] && echo yes || echo no) |"
            echo "| coverage-receipt.json | $([ -s target/tarpaulin/coverage-receipt.json ] && echo yes || echo no) |"
            echo ""
            echo "Codecov flag: \`rust-core-runtime\`"
            echo "Claim boundary: scoped Rust execution-surface evidence only."
          } >> "$GITHUB_STEP_SUMMARY"
